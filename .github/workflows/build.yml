name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project.zip
        run: |
          mkdir -p src
          unzip -q project.zip -d src
          cd src
          if [ ! -f settings.gradle.kts ]; then cd "$(dirname "$(find . -name settings.gradle.kts | head -1)")"; fi
          echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LocalHotspot-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LocalHotspot build ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
